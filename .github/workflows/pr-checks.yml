name: PR Checks

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint_test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade --only-binary :all: pip==25.0.1
          python -m pip install --only-binary :all: -r requirements.test.txt
          
      - name: Lint (ruff)
        run: ruff check --select F,E9 .

      - name: Tests
        run: pytest -q
