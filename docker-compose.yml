version: "3.9"

services:
  db:
    image: postgis/postgis:17-3.4
    container_name: postgis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: location_db
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/location_db

    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
